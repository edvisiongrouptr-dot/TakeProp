version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: takeprop
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - '3000:3000'
  web:
    build: ./apps/web
    env_file: .env
    depends_on:
      - api
    ports:
      - '3001:3000'

volumes:
  db-data:
